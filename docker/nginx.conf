user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 64m;
    client_body_timeout 60s;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml;

    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_forwarded_proto $fastcgi_https {
        default off;
        https on;
    }

    # Coolify terminates TLS and talks to this container over plain HTTP.
    # $scheme is therefore "http" even when the browser used HTTPS. tusd
    # builds the upload Location from X-Forwarded-Proto, so keep the outer value.
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    include /etc/nginx/tus-origins.conf;

    # An SVG opened directly is a document; sandbox it so any missed script cannot run.
    map $uri $storage_csp {
        default "";
        ~*\.svgz?$ "default-src 'none'; style-src 'unsafe-inline'; img-src data:; sandbox";
    }

    server {
        listen 80 default_server;
        server_name _;

        root /var/www/public;
        index index.php;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location /build/assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location ~* \.(?:jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|css|js)$ {
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        location /api {
            try_files $uri $uri/ /index.php?$query_string;
            limit_req zone=api burst=50 nodelay;
        }

        # tusd on 127.0.0.1:1080. Each PATCH stays under 16m. PHP does not read the body.
        location /tus/ {
            client_max_body_size 16m;
            client_body_timeout 120s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://127.0.0.1:1080;

            add_header Access-Control-Allow-Origin $frontend_cors_origin always;
            add_header Access-Control-Allow-Methods "POST, HEAD, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Upload-Length, Upload-Offset, Upload-Metadata, Tus-Resumable, Upload-Defer-Length, Upload-Concat, X-Requested-With" always;
            add_header Access-Control-Expose-Headers "Location, Upload-Offset, Upload-Length, Tus-Resumable, Tus-Version, Tus-Extension, Upload-Metadata" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $frontend_cors_origin always;
                add_header Access-Control-Allow-Methods "POST, HEAD, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Upload-Length, Upload-Offset, Upload-Metadata, Tus-Resumable, Upload-Defer-Length, Upload-Concat, X-Requested-With" always;
                add_header Access-Control-Expose-Headers "Location, Upload-Offset, Upload-Length, Tus-Resumable, Tus-Version, Tus-Extension, Upload-Metadata" always;
                add_header Content-Length 0;
                return 204;
            }
        }

        location ^~ /storage/ {
            add_header Access-Control-Allow-Origin $frontend_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy $storage_csp always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $frontend_cors_origin always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Content-Length 0;
                return 204;
            }

            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
            limit_req zone=general burst=20 nodelay;
        }

        # Only the front controller is executable. /up and all other routes
        # go through Laravel via index.php (no static Nginx stub).
        location = /index.php {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $fastcgi_https;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
            fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_read_timeout 120s;
            fastcgi_send_timeout 120s;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_busy_buffers_size 32k;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known/) {
            deny all;
        }

        location ~* /(?:composer\.(?:json|lock)|package(?:-lock)?\.json|pnpm-lock\.yaml|vite\.config\.|artisan$) {
            deny all;
        }
    }
}
