[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/bin/sh -c 'exec /usr/local/bin/php /var/www/artisan queue:work "${QUEUE_CONNECTION}" --queue="${QUEUE_NAMES}" --sleep="${QUEUE_SLEEP}" --tries="${QUEUE_TRIES}" --timeout="${QUEUE_TIMEOUT}" --max-time="${QUEUE_MAX_TIME}" --memory="${QUEUE_MEMORY}" --no-interaction'
directory=/var/www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=%(ENV_QUEUE_PROCESSES)s
stopsignal=TERM
stopwaitsecs=360
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:laravel-media-worker]
process_name=%(program_name)s
command=/bin/sh -c 'exec /usr/local/bin/php /var/www/artisan queue:work "${QUEUE_CONNECTION}" --queue=media --sleep=3 --tries=1 --timeout=7200 --max-time=7200 --memory=512 --no-interaction'
directory=/var/www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
stopsignal=TERM
stopwaitsecs=7200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=21

; One process, so a backup and a restore never run side by side. The timeout
; matches CreateBackupJob / RestoreBackupJob.
[program:laravel-backup-worker]
process_name=%(program_name)s
command=/bin/sh -c 'exec /usr/local/bin/php /var/www/artisan queue:work "${QUEUE_CONNECTION}" --queue=backups --sleep=3 --tries=1 --timeout=3600 --max-time=3600 --memory=512 --no-interaction'
directory=/var/www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
stopsignal=TERM
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=22

; SEO jobs (files, path probes, audits) on their own connection, whose
; retry_after (SEO_QUEUE_RETRY_AFTER, 960) stays above the audit timeout.
[program:laravel-seo-worker]
process_name=%(program_name)s
command=/bin/sh -c 'exec /usr/local/bin/php /var/www/artisan queue:work "${SEO_QUEUE_CONNECTION:-redis-seo}" --queue="${SEO_QUEUE:-seo}" --sleep=3 --tries=1 --timeout=900 --max-time=3600 --memory=256 --no-interaction'
directory=/var/www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
stopsignal=TERM
stopwaitsecs=900
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=23

[program:tusd]
command=/bin/sh -c 'exec /usr/local/bin/tusd -host=127.0.0.1 -port=1080 -base-path=/tus/ -behind-proxy -disable-cors -upload-dir=/var/www/storage/app/tus -hooks-http="http://127.0.0.1/internal/tus?secret=${TUS_HOOK_SECRET:-}" -hooks-http-timeout=120s -hooks-enabled-events=pre-create,pre-finish,post-finish,post-terminate -request-completion-timeout=3m'
directory=/var/www
user=www-data
autostart=true
autorestart=true
priority=15
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-scheduler]
command=/usr/local/bin/php /var/www/artisan schedule:work --no-interaction
directory=/var/www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=25

; FUTURE: Laravel Horizon
; Enable only after `composer require laravel/horizon` and publishing its assets.
; Then set autostart=false (or remove) laravel-queue-worker above so Horizon is
; the sole Redis queue consumer — never run both against the same queues.
;
; [program:laravel-horizon]
; command=/usr/local/bin/php /var/www/artisan horizon
; directory=/var/www
; user=www-data
; autostart=true
; autorestart=true
; stopasgroup=true
; killasgroup=true
; stopsignal=TERM
; stopwaitsecs=360
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0
; priority=20

