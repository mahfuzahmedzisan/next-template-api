; user=www-data
; autostart=true
; autorestart=true
; stopasgroup=true
; killasgroup=true
; stopsignal=TERM
; stopwaitsecs=30
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0
; priority=22
